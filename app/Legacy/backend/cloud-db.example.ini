; HIMS cloud database settings (hostforge MySQL).
; 1. Copy this file to cloud-db.ini in the same backend folder.
; 2. Fill in the values from hostforge > MySQL Databases.
; The password is NOT stored here: you type it when you run "START HIMS CLOUD.bat".

host = "mysql.yourdomain.com"
port = 3306
database = "youraccount_hr3_system"
user = "youraccount_hr3_app"
