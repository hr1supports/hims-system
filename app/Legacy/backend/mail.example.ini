; HIMS sign-in code email (used when the system is deployed).
; While this file is NOT named mail.ini, sign-in codes are printed in the PHP server window instead.
;
; 1. Create a sender email account (for example in your hostforge control panel > Email Accounts).
; 2. Copy this file to mail.ini in the same backend folder and fill in the values below.
; 3. Give the email password in the HR3_SMTP_PASSWORD environment variable when the server starts.
;    The password is NOT stored in this file.

host = "mail.yourdomain.com"
port = 587
encryption = "tls"        ; "tls" for port 587, "ssl" for port 465
user = "noreply@yourdomain.com"
from = "noreply@yourdomain.com"
from_name = "HIMS Hospital System"
